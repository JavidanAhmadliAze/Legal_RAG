[project]
name = "legal-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
index = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "opensearch-py>=2.4",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]
ui = [
    "gradio>=4.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]
monitoring = [
    "arize-phoenix>=4.0",
    "openinference-instrumentation-langchain>=0.1.12",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]
agent = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
